# "Refined Sidebar" theme: warm paper canvas, near-black ink, white cards; coral is used only for small eyebrows.
# Fonts (Satoshi / Cabinet Grotesk) are loaded and applied in app/streamlit_app.py.
[theme]
base = "light"
primaryColor = "#17191D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F6F4"
textColor = "#17191D"
font = "sans serif"

[client]
toolbarMode = "minimal"
